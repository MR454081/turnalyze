services:
  - type: web
    name: turnalyze
    runtime: python
    build:
      commands:
        - pip install --upgrade pip
        - pip install --no-cache-dir -r requirements.txt
        # Chromium is installed into the canonical Render path.
        # browser_runtime.py forces PLAYWRIGHT_BROWSERS_PATH to the same
        # value at runtime, so build and runtime always agree.
        - PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.cache/playwright python -m playwright install chromium
        # DO NOT add "playwright install --with-deps" and DO NOT add apt-get here.
        # Render's native runtime builds are unprivileged, so both fail with
        # "su: Authentication failure" / "Permission denied".
    start:
      cmd: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 300 app:app
    env:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Kept for documentation; browser_runtime.py will override to the
      # canonical path on Render native if this is missing.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright
      - key: LOG_LEVEL
        value: INFO
    plan: standard
